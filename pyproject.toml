[project]
name = "rerun-viz"
version = "0.1.0"
description = "Rerun visualization and Open3D TSDF reconstruction for RGB-D + mocap rover bags"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "open3d>=0.20.0",
    "opencv-python>=5.0.0.93",
    "pyrealsense2>=2.58.4.10922",
    "pyyaml>=6.0.3",
    "rerun-sdk>=0.37.2",
    "rich>=15.0.0",
    "rosbags>=0.11.5",
    "scipy>=1.18.1",
    "textual>=8.2.8",
    "typer>=0.27.3",
]

[project.scripts]
rerun-viz = "rerun_viz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rerun_viz"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
